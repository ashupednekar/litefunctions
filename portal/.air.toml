root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  pre_cmd = ["templ generate"]
  entrypoint = ["./tmp/main"]
  args_bin = ["listen"]
  include_ext = ["go", "templ"]
  exclude_dir = ["tmp", "vendor", "node_modules", ".git", "static", "docs", "migrations"]
  exclude_regex = ["_templ\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true
