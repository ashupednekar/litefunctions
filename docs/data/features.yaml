- title: "Functions"
  body: "Five runtimes, a package-aware editor, Vim and telescope navigation, and per-function compute settings."
- title: "Data"
  body: "S3-compatible object buckets, table definitions and .sql views, plus a sqlc query workspace."
- title: "Plan"
  body: "Describe a use case and review the functions, schema, routes and policies before anything ships."
- title: "Traffic"
  body: "Endpoints and gateway routes with auth, rate limits and resilience policies at the edge."
- title: "Observability"
  body: "Metrics, logs, traces and SLOs for every function, with a live operations surface."
- title: "Audit"
  body: "Every privileged action lands in an immutable log, available from a bottom console drawer."
