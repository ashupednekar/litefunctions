- eyebrow: "WORKSPACE"
  title: "Everything at a glance."
  body: "Projects, functions, endpoints and request history live in one dense, keyboard-first shell. Collapse the sidebar to an icon rail when you need more canvas."
  bullets:
    - "Project switcher, health and usage in one view"
    - "Activity plus a Postman-style request log"
    - "⌘K command palette for everything"
  file: "02-dashboard.png"
  caption: "Dashboard / workspace"
- eyebrow: "BUILD · FUNCTIONS"
  title: "Runtime controls, per function."
  body: "Choose the runtime interface and rate limit for each function, not the whole project. Python, TypeScript and Lua can share a warm interpreter or take a dedicated one."
  bullets:
    - "containerd by default; gVisor, Kata, WASM and Firecracker opt-in"
    - "Shared vs dedicated runtime for dynamic languages"
    - "Rate limits and resources scoped to the function"
  file: "05-function-config.png"
  caption: "Functions / per-function config"
- eyebrow: "BUILD · EDITOR"
  title: "A package-aware editor."
  body: "Functions are directories. Expand the package tree, switch files, and use Vim or the built-in telescope search without leaving the portal."
  bullets:
    - "Package tree collapsed by default"
    - "space space for file search"
    - "space / for content search"
  file: "07-function-editor.png"
  caption: "Editor / package tree"
- eyebrow: "DATA"
  title: "Data without a second console."
  body: "S3-compatible buckets, table definitions and sqlc queries live beside the functions that use them. Run a query and inspect rows in place."
  bullets:
    - "Objects, Tables and Queries under one Data section"
    - "Table definitions and .sql views"
    - "sqlc query editor with results"
  file: "12-queries.png"
  caption: "Data / queries"
- eyebrow: "BUILD · PLAN"
  title: "Plan before you ship."
  body: "Describe a use case and review the functions, schema, routes and policies an agent would generate. Nothing is applied until you approve it."
  bullets:
    - "Repo-aware context inspection"
    - "Functions, migrations, streams and policies as artifacts"
    - "Review each artifact before apply"
  file: "13-plan.png"
  caption: "Plan / generated artifacts"
- eyebrow: "OPERATE"
  title: "Know what happened."
  body: "Metrics, logs, traces and SLOs live next to the functions they describe, so an incident does not start with a dashboard hunt."
  bullets:
    - "Latency, errors and throughput per function"
    - "Trace waterfall and log explorer"
    - "SLOs with availability and latency targets"
  file: "14-observability.png"
  caption: "Observability / metrics and traces"
- eyebrow: "PROJECT · AUDIT"
  title: "Audit without leaving the page."
  body: "The bottom console keeps recent privileged actions one click away, with the full immutable log a link away."
  bullets:
    - "Secret reveals, access changes and policy edits"
    - "Actor, target and request metadata"
    - "Retained 400 days and exportable"
  file: "17-audit-popover.png"
  caption: "Audit / bottom console"
