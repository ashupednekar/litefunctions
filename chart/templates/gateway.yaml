{{- if .Values.gatewayApi.enabled }}
{{- $hosts := include "litefunctions.gatewayHosts" . | fromYaml }}
{{- $portalHosts := $hosts.portal }}
{{- $giteaHosts := $hosts.gitea }}
{{- $gatewayName := include "litefunctions.gatewayName" . }}
{{- $gatewayClassName := .Values.gatewayApi.gatewayClassName }}
{{- $httpPort := .Values.gatewayApi.http.port }}
{{- $tlsEnabled := .Values.gatewayApi.tls.enabled }}
{{- $tlsPort := .Values.gatewayApi.tls.port }}
{{- $tlsSecretName := .Values.gatewayApi.tls.secretName }}
{{- $listenerHosts := concat $portalHosts $giteaHosts $hosts.rustfs $hosts.rustfsConsole | uniq }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ $gatewayClassName | quote }}
  listeners:
  {{- range $index, $host := $listenerHosts }}
  - name: {{ printf "http-%d" $index }}
    protocol: HTTP
    port: {{ $httpPort }}
    hostname: {{ $host | quote }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  {{- if $tlsEnabled }}
  {{- range $index, $host := $listenerHosts }}
  - name: {{ printf "https-%d" $index }}
    protocol: HTTPS
    port: {{ $tlsPort }}
    hostname: {{ $host | quote }}
    tls:
      certificateRefs:
      - kind: Secret
        name: {{ $tlsSecretName }}
    allowedRoutes:
      namespaces:
        from: Same
  {{- end }}
  {{- end }}
{{- if .Values.ui.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litefunctions-portal
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ $gatewayName }}
  hostnames:
  {{- range $host := $portalHosts }}
  - {{ $host | quote }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: litefunctions-portal
      port: 3000
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litefunctions-ingestor
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ $gatewayName }}
  hostnames:
  {{- range $host := $portalHosts }}
  - {{ $host | quote }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /lambda
    backendRefs:
    - name: litefunctions-ingestor
      namespace: {{ .Release.Namespace }}
      port: 3000
{{- if .Values.gitea.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litefunctions-gitea
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - name: {{ $gatewayName }}
  hostnames:
  {{- range $host := $giteaHosts }}
  - {{ $host | quote }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "gitea.fullname" (index .Subcharts "gitea") }}-http
      port: {{ .Values.gitea.service.http.port }}
{{- end }}
{{- if .Values.rustfs.enabled }}
{{- range $name, $routeHosts := dict "rustfs" $hosts.rustfs "rustfsConsole" $hosts.rustfsConsole }}
{{- if $routeHosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litefunctions-{{ $name | kebabcase }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
  - name: {{ $gatewayName }}
  hostnames:
    {{- toYaml $routeHosts | nindent 4 }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "rustfs.fullname" (index $.Subcharts "rustfs") }}-svc
      port: {{ if eq $name "rustfs" }}{{ $.Values.rustfs.service.endpoint.port }}{{ else }}{{ $.Values.rustfs.service.console.port }}{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
