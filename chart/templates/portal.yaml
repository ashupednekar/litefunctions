{{- if .Values.ui.enabled }}
{{- if .Values.ui.admin.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: litefunctions-portal-admin
  namespace: {{ .Release.Namespace }}
  labels:
    app: litefunctions-portal
    {{- include "litefunctions.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.ui.admin.password | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litefunctions-portal
  namespace: {{ .Release.Namespace }}
  labels:
    app: litefunctions-portal
    {{- include "litefunctions.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: litefunctions-portal
      {{- include "litefunctions.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: litefunctions-portal
        {{- include "litefunctions.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - image: {{ .Values.images.portal }}
        name: litefunctions-portal
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VCS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ui.vcs.secret }}
              key: {{ .Values.ui.vcs.key }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ui.db.secret }}
              key: {{ .Values.ui.db.key }}
        - name: FQDN
          value: {{ .Values.ui.domain | quote }}
        - name: ADMIN_LOGIN_ENABLED
          value: {{ .Values.ui.admin.enabled | quote }}
        {{- if .Values.ui.admin.enabled }}
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litefunctions-portal-admin
              key: password
        {{- end }}
        - name: TRUSTED_PROXIES
          value: {{ join "," .Values.ui.trustedProxies | quote }}
        - name: COOKIE_SECURE
          value: {{ .Values.gatewayApi.tls.enabled | quote }}
        - name: AGENT_ENABLED
          value: {{ .Values.agent.enabled | quote }}
        {{- if .Values.agent.enabled }}
        - name: OPENCODE_URL
          value: {{ printf "http://litefunctions-opencode:%v" .Values.agent.service.port | quote }}
        - name: OPENCODE_USERNAME
          value: {{ .Values.agent.username | quote }}
        - name: OPENCODE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litefunctions-opencode
              key: password
        - name: OPENCODE_AGENT
          value: {{ .Values.agent.name | quote }}
        - name: OPENCODE_MODEL
          value: {{ .Values.agent.model | quote }}
        - name: OPENCODE_TIMEOUT_SECONDS
          value: {{ .Values.agent.timeoutSeconds | quote }}
        - name: AGENT_SYNC_SECONDS
          value: {{ .Values.agent.syncSeconds | default 60 | quote }}
        - name: AGENT_POLL_SECONDS
          value: {{ .Values.agent.pollSeconds | default 3 | quote }}
        - name: MCP_TOKEN
          value: {{ .Values.agent.mcp.token | quote }}
        {{- end }}
        - name: VCS_AUTH_MODE
          value: token
        - name: VCS_USER
          value: {{ .Values.gitea.gitea.admin.username | quote }}
        - name: VCS_VENDOR
          value: gitea
        - name: LOKI_HOST
          value: {{ .Values.ui.lokiHost | quote }}
        - name: VCS_BASE_URL
          value: {{ .Values.ui.vcs.baseUrl | quote }}
        - name: VCS_PUBLIC_BASE_URL
          value: {{ .Values.ui.vcs.publicBaseUrl | quote }}
        resources: {}
        lifecycle:
          postStart:
            exec:
              command:
              - /app/server
              - migrate
              - up
---
apiVersion: v1
kind: Service
metadata:
  name: litefunctions-portal
  labels:
    app: litefunctions-portal
    {{- include "litefunctions.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ui.service.type }}
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
    {{- if eq .Values.ui.service.type "NodePort" }}
    nodePort: {{ .Values.ui.service.nodePort }}
    {{- end }}
  selector:
    app: litefunctions-portal
    {{- include "litefunctions.selectorLabels" . | nindent 4 }}
{{- end }}
