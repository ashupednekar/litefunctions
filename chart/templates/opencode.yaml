{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: litefunctions-opencode
  namespace: {{ .Release.Namespace }}
  labels:
    app: litefunctions-opencode
    {{- include "litefunctions.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.agent.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litefunctions-opencode-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: litefunctions-opencode
    {{- include "litefunctions.labels" . | nindent 4 }}
data:
  opencode.json: |
{{ tpl (.Files.Get "files/opencode.json") . | indent 4 }}
  AGENTS.md: |
{{ .Files.Get "files/AGENTS.md" | indent 4 }}
{{- if .Values.agent.persistence.workspace.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litefunctions-opencode-workspace
  namespace: {{ .Release.Namespace }}
  labels:
    app: litefunctions-opencode
    {{- include "litefunctions.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  {{- if .Values.agent.persistence.workspace.storageClass }}
  storageClassName: {{ .Values.agent.persistence.workspace.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.agent.persistence.workspace.size | quote }}
{{- end }}
{{- if .Values.agent.persistence.data.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litefunctions-opencode-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: litefunctions-opencode
    {{- include "litefunctions.labels" . | nindent 4 }}
spec:
  accessModes:
  - ReadWriteOnce
  {{- if .Values.agent.persistence.data.storageClass }}
  storageClassName: {{ .Values.agent.persistence.data.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.agent.persistence.data.size | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litefunctions-opencode
  namespace: {{ .Release.Namespace }}
  labels:
    app: litefunctions-opencode
    {{- include "litefunctions.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agent.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: litefunctions-opencode
      {{- include "litefunctions.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: litefunctions-opencode
        {{- include "litefunctions.selectorLabels" . | nindent 8 }}
      annotations:
        # subPath mounts are not updated in place, so roll the pod whenever the
        # rendered config changes.
        checksum/opencode-config: {{ printf "%s%s" (tpl (.Files.Get "files/opencode.json") .) (.Files.Get "files/AGENTS.md") | sha256sum }}
    spec:
      containers:
      - name: opencode
        image: {{ .Values.images.opencode }}
        imagePullPolicy: IfNotPresent
        workingDir: /workspace
        args:
        - serve
        - --print-logs
        - --hostname
        - 0.0.0.0
        - --port
        - {{ .Values.agent.service.port | quote }}
        env:
        - name: OPENCODE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: litefunctions-opencode
              key: password
        ports:
        - name: http
          containerPort: {{ .Values.agent.service.port }}
          protocol: TCP
        resources:
          {{- toYaml .Values.agent.resources | nindent 10 }}
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: data
          mountPath: /root/.local/share/opencode
        # Mount the config files individually: opencode writes its own files
        # (for example .gitignore) into the config directory, so the directory
        # itself must stay writable.
        - name: config
          mountPath: /root/.config/opencode/opencode.json
          subPath: opencode.json
        - name: config
          mountPath: /root/.config/opencode/AGENTS.md
          subPath: AGENTS.md
      volumes:
      - name: workspace
        {{- if .Values.agent.persistence.workspace.enabled }}
        persistentVolumeClaim:
          claimName: litefunctions-opencode-workspace
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: data
        {{- if .Values.agent.persistence.data.enabled }}
        persistentVolumeClaim:
          claimName: litefunctions-opencode-data
        {{- else }}
        emptyDir: {}
        {{- end }}
      - name: config
        configMap:
          name: litefunctions-opencode-config
---
apiVersion: v1
kind: Service
metadata:
  name: litefunctions-opencode
  namespace: {{ .Release.Namespace }}
  labels:
    app: litefunctions-opencode
    {{- include "litefunctions.labels" . | nindent 4 }}
spec:
  type: {{ .Values.agent.service.type }}
  ports:
  - name: http
    port: {{ .Values.agent.service.port }}
    targetPort: {{ .Values.agent.service.port }}
    protocol: TCP
  selector:
    app: litefunctions-opencode
{{- end }}
