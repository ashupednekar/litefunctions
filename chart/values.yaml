gatewayApi:
  enabled: true
  gatewayClassName: istio
  ingressGateway:
    serviceName: istio-ingressgateway
    namespace: istio-system
  hosts:
    portal: []
    gitea: []
    grafana: [litefunctions.grafana]
    rustfs: [lws.ashudev.in]
    rustfsConsole: []
  http:
    port: 80
  tls:
    enabled: true
    port: 443
    secretName: litefunctions-gateway-tls
    certManager:
      enabled: true
      duration: 2160h
      renewBefore: 360h
      selfSigned:
        enabled: true
        issuerName: litefunctions-selfsigned
      letsencrypt:
        enabled: false
        issuerName: litefunctions-letsencrypt
        email: ""
        server: https://acme-v02.api.letsencrypt.org/directory
        privateKeySecretName: litefunctions-letsencrypt-account-key

cert-manager:
  config:
    enableGatewayAPI: true
  crds:
    enabled: true
ngrok:
  enabled: false

images:
  ingestor: ashupednekar535/litefunctions-ingestor:latest
  giteaSetup: ashupednekar535/litefunctions-gitea-setup:latest
  operator: ashupednekar535/litefunctions-operator:latest
  portal: ashupednekar535/litefunctions-portal:latest
  ollyBuckets: amazon/aws-cli:2.40.1

# Olly is the bundled observability stack (Loki, Mimir, Grafana, Tempo and
# Grafana Alloy). Logs and metrics are enabled by default; traces are opt-in.
# Storage defaults to the RustFS subchart so the data survives restarts.
olly:
  logs:
    enabled: true
  metrics:
    enabled: true
  traces:
    enabled: false
  grafana:
    enabled: true
  alloy:
    enabled: true

operator:
  registry: localhost:30050
  registry_user: ashudev
  nats_url: nats://litefunctions-nats:4222
  vcs_base_url: http://litefunctions-gitea-http:3000
  git_token_secret_name: litefunctions-admin-token
  git_token_secret_key: token
  redis_url: redis://litefunctions-valkey:6379
  deprovision_duration: 2m
  keep_warm_duration: 5m
  service:
    type: ClusterIP
  #NOTE: rest are defaulting in operator manager settings, add here if needed

ingestor:
  service:
    type: NodePort
  nats_url: litefunctions-nats:4222

nats:
  enabled: true
  natsBox:
    enabled: false
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        enabled: true
        pvc:
          enabled: true
          size: 4Gi
    reloader:
      enabled: false
 

database:
  enabled: true
  postgresVersion: 16
  pgBouncerReplicas: 1
  instanceReplicas: 2
  instanceVolumeSize: 4Gi
  initialSchemas:
    - gitea
    - litefunctions

rustfs:
  enabled: true
  replicaCount: 1
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  secret:
    rustfs:
      access_key: ashudev
      secret_key: minioadmin
  storageclass:
    name: "" # use the cluster's default storage class
    dataStorageSize: 15Gi
    logStorageSize: 256Mi
  # Routing and TLS are managed by the shared Gateway, not the subchart.
  ingress:
    enabled: false
  gatewayApi:
    enabled: false

valkey:
  auth:
    enabled: true
    aclUsers:
      default:
        permissions: "~* &* +@all"
        password: valkeyadmin

gitea:
  enabled: true
  service:
    http:
      type: NodePort
      nodePort: 30080
    ssh:
      type: NodePort
      nodePort: 30022
  postgresql-ha:
    enabled: false
  postgresql:
    enabled: false
  valkey-cluster:
    enabled: false
  gitea:
    admin:
      username: ashudev
      password: gitadmin
      email: gitea@ashudev.in
    config:
      actions:
        enabled: true
      packages:
        enabled: true
      server:
        ROOT_URL: "http://litefunctions-gitea-http.litefunctions.svc.cluster.local:3000/"
        DOMAIN: "litefunctions-gitea-http.litefunctions.svc.cluster.local"
      registry:
        enabled: false
      database:
        DB_TYPE: postgres
        NAME: litefunctions
        SCHEMA: gitea
        SSL_MODE: require
        HOST: "litefunctions-pgbouncer.litefunctions.svc"
    additionalConfigFromEnvs:
    - name: GITEA__DATABASE__HOST
      valueFrom:
        secretKeyRef:
          key: host
          name: litefunctions-pguser-litefunctions
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
       secretKeyRef:
         key: password
         name: litefunctions-pguser-litefunctions
    - name: GITEA__DATABASE__NAME
      valueFrom:
        secretKeyRef:
          key: dbname
          name: litefunctions-pguser-litefunctions
    - name: GITEA__DATABASE__USER
      valueFrom:
        secretKeyRef:
          key: user
          name: litefunctions-pguser-litefunctions
  ingress:
    enabled: false

actions:
  enabled: true
  giteaRootURL: http://litefunctions-gitea-http:3000
  existingSecret: litefunctions-registration-token
  existingSecretKey: token

zot:
  service:
    nodePort: 30050

ui:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
    nodePort: 30003
  db:
    secret: litefunctions-pguser-litefunctions
    key: pgbouncer-uri
  vcs:
    baseUrl: http://litefunctions-gitea-http:3000
    publicBaseUrl: https://litefunctions.gitea
    secret: litefunctions-admin-token
    key: token
  domain: litefunctions.portal
  ngrok:
    secret: litefunctions-ngrok-secret
    key: token

# Loki stores logs in RustFS. Credentials are injected from the RustFS Secret
# and expanded by Loki because global.extraArgs enables config expansion.
loki:
  deploymentMode: SingleBinary
  global:
    extraArgs:
      - -config.expand-env=true
    extraEnvFrom:
      - secretRef:
          name: litefunctions-rustfs-secret
  loki:
    auth_enabled: false
    commonConfig:
      path_prefix: /var/loki
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    storage:
      type: s3
      bucketNames:
        chunks: litefunctions-loki-chunks
        ruler: litefunctions-loki-ruler
        admin: litefunctions-loki-admin
      s3:
        endpoint: litefunctions-rustfs-svc:9000
        region: us-east-1
        accessKeyId: ${RUSTFS_ACCESS_KEY}
        secretAccessKey: ${RUSTFS_SECRET_KEY}
        s3ForcePathStyle: true
        insecure: true
  singleBinary:
    replicas: 1
    extraArgs:
      - -config.expand-env=true
    extraEnvFrom:
      - secretRef:
          name: litefunctions-rustfs-secret
    persistence:
      enabled: true
      size: 2Gi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  lokiCanary:
    enabled: false
  minio:
    enabled: false
  test:
    enabled: false
  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false

# Mimir keeps metrics durable in RustFS. Prometheus scrapes and remote-writes
# into Mimir, while Grafana queries Mimir through its Prometheus-compatible API.
mimir-distributed:
  kafka:
    enabled: false
  minio:
    enabled: false
  alertmanager:
    enabled: false
  ruler:
    enabled: false
  overrides_exporter:
    enabled: false
  rollout_operator:
    enabled: false
  compactor:
    replicas: 1
    persistentVolume:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  distributor:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  ingester:
    replicas: 1
    zoneAwareReplication:
      enabled: false
    persistentVolume:
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
  querier:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  query_frontend:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
  query_scheduler:
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
  store_gateway:
    replicas: 1
    zoneAwareReplication:
      enabled: false
    persistentVolume:
      size: 2Gi
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
  gateway:
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
  global:
    extraEnvFrom:
      - secretRef:
          name: litefunctions-rustfs-secret
  mimir:
    structuredConfig:
      multitenancy_enabled: false
      ingest_storage:
        enabled: false
        kafka:
          address: null
          topic: null
          auto_create_topic_default_partitions: null
      distributor:
        remote_timeout: null
      ingester:
        push_grpc_method_enabled: true
      blocks_storage:
        backend: s3
        s3:
          endpoint: litefunctions-rustfs-svc:9000
          region: us-east-1
          access_key_id: ${RUSTFS_ACCESS_KEY}
          secret_access_key: ${RUSTFS_SECRET_KEY}
          bucket_name: litefunctions-mimir-tsdb
          insecure: true

# Prometheus is the scraper in front of Mimir. Mimir itself provides the
# durable, Prometheus-compatible query API used by Grafana.
prometheus:
  alertmanager:
    enabled: false
  pushgateway:
    enabled: false
  server:
    retention: 2h
    persistentVolume:
      enabled: false
    remoteWrite:
      - url: http://litefunctions-mimir-gateway/api/v1/push

# Tempo is opt-in (olly.traces.enabled). When enabled it also stores traces in
# RustFS and can be added as a Grafana datasource.
tempo:
  tempo:
    storage:
      trace:
        backend: s3
        s3:
          bucket: litefunctions-tempo-traces
          endpoint: litefunctions-rustfs-svc:9000
          access_key: ${RUSTFS_ACCESS_KEY}
          secret_key: ${RUSTFS_SECRET_KEY}
          insecure: true
  extraArgs:
    config.expand-env: "true"
  extraEnvFrom:
    - secretRef:
        name: litefunctions-rustfs-secret

grafana:
  adminUser: admin
  adminPassword: admin
  persistence:
    enabled: true
    size: 2Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Mimir
          uid: prom
          type: prometheus
          access: proxy
          url: http://litefunctions-mimir-gateway/prometheus
          isDefault: true
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://litefunctions-loki-gateway
          isDefault: false

# Alloy only tails logs from pods labelled app=runtime. The label is applied by
# the operator to every function runtime Deployment.
alloy:
  alloy:
    configMap:
      content: |
        discovery.kubernetes "runtime_pods" {
          role = "pod"

          selectors {
            role  = "pod"
            label = "app=runtime"
          }
        }

        discovery.relabel "runtime_pods" {
          targets = discovery.kubernetes.runtime_pods.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            regex         = "runtime"
            action        = "keep"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label  = "app"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_lang"]
            target_label  = "lang"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_project"]
            target_label  = "project"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_label_function"]
            target_label  = "function"
          }
        }

        loki.source.kubernetes "runtime_pods" {
          targets    = discovery.relabel.runtime_pods.output
          forward_to = [loki.write.loki.receiver]
        }

        loki.write "loki" {
          endpoint {
            url = "http://litefunctions-loki-gateway/loki/api/v1/push"
          }
        }
