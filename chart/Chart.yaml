apiVersion: v2
name: litefunctions 
description: A Helm chart for Kubernetes
icon: https://github.com/user-attachments/assets/8451ab69-19dd-4c83-893c-1e98593d3f4e
type: application
version: 0.2.0
appVersion: "1.16.0"
home: https://ashupednekar.github.io/litefunctions/docs/
sources:
  - https://github.com/ashupednekar/litefunctions
annotations:
  artifacthub.io/links: |
    - name: Documentation
      url: https://ashupednekar.github.io/litefunctions/docs/
    - name: Helm Chart Guide
      url: https://ashupednekar.github.io/litefunctions/docs/helm-chart/
    - name: Source
      url: https://github.com/ashupednekar/litefunctions

dependencies:
- name: nats
  version: 2.12.3
  repository: https://nats-io.github.io/k8s/helm/charts
  condition: nats.enabled
- name: valkey
  version: 0.12.0
  repository: https://valkey.io/valkey-helm/ 
  condition: redis.enabled
- name: pgo
  version: 5.8.1
  repository: oci://registry-1.docker.io/ashupednekar535
  condition: database.enabled
- name: rustfs
  version: 1.0.1
  repository: https://charts.rustfs.com/
  condition: rustfs.enabled
- name: gitea
  repository: https://dl.gitea.com/charts/
  version: 12.4.0
  condition: gitea.enabled
- name: actions
  repository: https://dl.gitea.com/charts/
  version: 0.0.2
  condition: gitea.enabled
- name: zot
  repository: http://zotregistry.dev/helm-charts
  version: 0.1.97
  condition: gitea.enabled
- name: cert-manager
  repository: oci://quay.io/jetstack/charts
  version: v1.20.0
  condition: gatewayApi.tls.certManager.enabled
- name: loki
  repository: https://grafana.github.io/helm-charts
  version: 7.6.0
  condition: olly.logs.enabled
- name: mimir-distributed
  repository: https://grafana.github.io/helm-charts
  version: 6.2.2
  condition: olly.metrics.enabled
- name: prometheus
  repository: https://prometheus-community.github.io/helm-charts
  version: 29.47.2
  condition: olly.metrics.enabled
- name: tempo
  repository: https://grafana.github.io/helm-charts
  version: 1.24.4
  condition: olly.traces.enabled
- name: grafana
  repository: https://grafana.github.io/helm-charts
  version: 10.5.15
  condition: olly.grafana.enabled
- name: alloy
  repository: https://grafana.github.io/helm-charts
  version: 1.15.0
  condition: olly.alloy.enabled
