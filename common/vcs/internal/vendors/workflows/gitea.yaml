name: litefunctions ci

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}-${{ gitea.sha }}
  cancel-in-progress: false

env:
  REGISTRY: litefunctions-zot:5000
  IMAGE_PREFIX: ashudev
  RUNTIME_ASSETS_IMAGE: ashupednekar535/litefunctions-runtime-assets:latest
  INGESTOR_HOOK_BASE_URL: http://litefunctions-ingestor:3000

  # Languages are described by exception. Defaults:
  #   type=dynamic, ext=<language>, aliases=[<ext>], mode=module
  # Static languages are compiled into images; dynamic languages are reloaded
  # by their warm runtime after the ingestor is notified.
  #
  # Paths follow the same convention for every language:
  #   context      runtimes/<language>
  #   dockerfile   build/runtimes/Dockerfile.<language>
  #   runtime dir  runtimes/<language>/internal (fallback: pkg)
  #   entrypoint   handle.<ext> (root or cmd/)
  # Add a static language here and to build-static.matrix below.
  LANGUAGES: |
    {
      "go":     {"type": "static", "mode": "package"},
      "rust":   {"type": "static", "ext": "rs"},
      "python": {"ext": "py"},
      "ts":     {"aliases": ["typescript"]},
      "lua":    {}
    }

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      static-functions: ${{ steps.changed.outputs.static-functions }}
      dynamic-languages: ${{ steps.changed.outputs.dynamic-languages }}
      repo_name: ${{ steps.repo.outputs.repo_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed functions
        id: changed
        run: |
          set -euo pipefail

          before='${{ gitea.event.before }}'
          after='${{ gitea.sha }}'

          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff-tree --root --no-commit-id --name-only -r "$after" -- 'functions/**' || true)
          else
            changed=$(git diff --name-only "$before..$after" -- 'functions/**' || true)
          fi

          # Fill in defaults once so every step sees the same shape.
          normalized=$(echo "$LANGUAGES" | jq -c '
            to_entries
            | map(
                .key as $name
                | (.value // {}) as $v
                | ($v.ext // $name) as $ext
                | {
                    name: $name,
                    type: ($v.type // "dynamic"),
                    ext: $ext,
                    aliases: (([$ext] + ($v.aliases // [])) | unique | map(select(. != $name))),
                    mode: ($v.mode // "module")
                  }
              )
          ')

          # The static matrix cannot be generated on this Gitea version, so keep
          # its literal list honest.
          static_languages=$(echo "$normalized" | jq -r '[.[] | select(.type == "static") | .name] | sort | join(" ")')
          if [ "$static_languages" != "go rust" ]; then
            echo "build-static.matrix is out of sync with LANGUAGES (static: $static_languages)" >&2
            exit 1
          fi

          # directory name -> canonical language name
          declare -A CANONICAL=()
          while IFS='=' read -r alias name; do
            [ -n "$alias" ] && CANONICAL["$alias"]="$name"
          done < <(
            echo "$normalized" | jq -r '.[] | .name as $n | ([$n] + .aliases)[] | "\(.)=\($n)"'
          )

          static_tmp=$(mktemp)
          dynamic_tmp=$(mktemp)

          if [ -n "$changed" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue

              dir_lang=$(echo "$path" | cut -d/ -f2)
              name=$(echo "$path" | cut -d/ -f3)
              lang="${CANONICAL[$dir_lang]:-}"
              [ -n "$name" ] && [ -n "$lang" ] || continue

              type=$(echo "$normalized" | jq -r --arg l "$lang" '.[] | select(.name == $l) | .type')
              case "$type" in
                static)
                  # Skip deleted functions; there is nothing left to build.
                  exists=false
                  while IFS= read -r candidate; do
                    [ -d "functions/$candidate/$name" ] && exists=true && break
                  done < <(echo "$normalized" | jq -r --arg l "$lang" '.[] | select(.name == $l) | ([.name, .ext] + .aliases) | unique | .[]')
                  if [ "$exists" = "true" ]; then
                    echo "$lang:$name" >> "$static_tmp"
                  fi
                  ;;
                dynamic)
                  echo "$lang" >> "$dynamic_tmp"
                  ;;
                *)
                  echo "Unknown language type '$type' for $lang" >&2
                  exit 1
                  ;;
              esac
            done <<< "$changed"
          fi

          static_functions=$(sort -u "$static_tmp" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          dynamic_languages=$(sort -u "$dynamic_tmp" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          rm -f "$static_tmp" "$dynamic_tmp"

          echo "static functions: $static_functions"
          echo "dynamic languages: $dynamic_languages"
          echo "static-functions=${static_functions:-[]}" >> "$GITHUB_OUTPUT"
          echo "dynamic-languages=${dynamic_languages:-[]}" >> "$GITHUB_OUTPUT"

      - name: Set repo name
        id: repo
        run: |
          echo "repo_name=$(basename '${{ gitea.repository }}')" >> "$GITHUB_OUTPUT"

  # Static path: compile the function package into a dedicated image.
  # Keep this list in sync with LANGUAGES; detect-changes validates it.
  build-static:
    needs: detect-changes
    if: needs.detect-changes.outputs.static-functions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go, rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: current-repo

      - name: Select changed function
        id: select
        env:
          LANGUAGE: ${{ matrix.language }}
          STATIC_FUNCTIONS: ${{ needs.detect-changes.outputs.static-functions }}
        run: |
          name=$(echo "$STATIC_FUNCTIONS" | jq -r --arg p "${LANGUAGE}:" \
            'map(select(startswith($p)) | sub($p; "")) | first // ""')
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Fetch runtime sources
        if: steps.select.outputs.name != ''
        run: |
          set -euo pipefail
          mkdir -p litefunctions

          # Runtime sources are shipped as a scratch image built from this
          # repository, so pull its layers straight from the registry instead
          # of cloning the repo (which is slow and flaky in-cluster).
          image="${RUNTIME_ASSETS_IMAGE}"
          repo="${image%:*}"
          tag="${image##*:}"
          registry="registry-1.docker.io"
          accept="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json"

          token=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull" | jq -r '.token')
          fetch() {
            curl -fsSL -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" "$1"
          }

          manifest=$(fetch "https://${registry}/v2/${repo}/manifests/${tag}")
          if echo "$manifest" | jq -e '.manifests' >/dev/null 2>&1; then
            # Skip provenance/attestation manifests (platform "unknown") and
            # prefer the linux/amd64 image the runner can execute.
            digest=$(echo "$manifest" | jq -r '
              ([.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")][0].digest)
              // ([.manifests[] | select(.platform.os != "unknown")][0].digest)
            ')
            test -n "$digest"
            test "$digest" != "null"
            manifest=$(fetch "https://${registry}/v2/${repo}/manifests/${digest}")
          fi

          while IFS= read -r layer; do
            [ -n "$layer" ] || continue
            fetch "https://${registry}/v2/${repo}/blobs/${layer}" | tar -xz -C litefunctions
          done <<< "$(echo "$manifest" | jq -r '.layers[].digest')"

          test -d litefunctions/build/runtimes
          test -d litefunctions/runtimes

      - name: Setup Kaniko config
        if: steps.select.outputs.name != ''
        run: |
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' '${{ env.IMAGE_PREFIX }}' '${{ secrets.GITEA_TOKEN }}' | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' '${{ env.REGISTRY }}' "$auth" > "$HOME/.docker/config.json"

      - name: Inject function into runtime
        if: steps.select.outputs.name != ''
        env:
          LANG: ${{ matrix.language }}
          NAME: ${{ steps.select.outputs.name }}
          REPO_NAME: ${{ needs.detect-changes.outputs.repo_name }}
        run: |
          set -euo pipefail

          echo "Injecting $LANG/$NAME"

          CFG=$(echo "$LANGUAGES" | jq -c --arg l "$LANG" '
            to_entries
            | map(
                .key as $name
                | (.value // {}) as $v
                | ($v.ext // $name) as $ext
                | {
                    name: $name,
                    type: ($v.type // "dynamic"),
                    ext: $ext,
                    aliases: (([$ext] + ($v.aliases // [])) | unique | map(select(. != $name))),
                    mode: ($v.mode // "module")
                  }
              )
            | .[] | select(.name == $l)
          ')
          if [ -z "$CFG" ]; then
            echo "No configuration for language: $LANG" >&2
            exit 1
          fi

          EXT=$(echo "$CFG" | jq -r '.ext')
          MODE=$(echo "$CFG" | jq -r '.mode')
          CONTEXT="runtimes/$LANG"
          DOCKERFILE="build/runtimes/Dockerfile.$LANG"

          FUNCTION_DIR=""
          for candidate in $(echo "$CFG" | jq -r '([.name, .ext] + .aliases) | unique | .[]'); do
            if [ -d "current-repo/functions/$candidate/$NAME" ]; then
              FUNCTION_DIR="current-repo/functions/$candidate/$NAME"
              break
            fi
          done
          if [ -z "$FUNCTION_DIR" ]; then
            echo "Function directory not found for $LANG/$NAME" >&2
            exit 1
          fi

          RUNTIME_DIR="litefunctions/$CONTEXT/internal"
          if [ ! -d "$RUNTIME_DIR" ]; then
            RUNTIME_DIR="litefunctions/$CONTEXT/pkg"
          fi
          if [ ! -d "$RUNTIME_DIR" ]; then
            echo "No runtime directory for $LANG" >&2
            exit 1
          fi

          ENTRYPOINT="handle.$EXT"
          if [ ! -f "$FUNCTION_DIR/$ENTRYPOINT" ] && [ -f "$FUNCTION_DIR/cmd/$ENTRYPOINT" ]; then
            ENTRYPOINT="cmd/$ENTRYPOINT"
          fi
          if [ ! -f "$FUNCTION_DIR/$ENTRYPOINT" ]; then
            echo "Entrypoint not found: $FUNCTION_DIR/$ENTRYPOINT (root or cmd/)" >&2
            exit 1
          fi

          if [ "$MODE" = "package" ]; then
            ASYNC_PATTERN='func[[:space:]]+StreamHandler'
          else
            ASYNC_PATTERN='stream_handler'
          fi
          TARGET_FILE="function.$EXT"
          if grep -Eq "$ASYNC_PATTERN" "$FUNCTION_DIR/$ENTRYPOINT"; then
            TARGET_FILE="function_async.$EXT"
          fi

          case "$MODE" in
            package)
              # Keep the whole function package together (internal/, assets,
              # etc.) and generate a thin runtime entrypoint. The runtime module
              # owns dependencies, so drop the function-level module files.
              PACKAGE_ROOT="litefunctions/$CONTEXT/functions"
              PACKAGE_NAME=$(basename "$FUNCTION_DIR" | tr -c '[:alnum:]_' '-' | sed 's/^-*//; s/-*$//')
              FUNCTION_PACKAGE_DIR="$PACKAGE_ROOT/$PACKAGE_NAME"
              mkdir -p "$FUNCTION_PACKAGE_DIR"
              cp -R "$FUNCTION_DIR"/. "$FUNCTION_PACKAGE_DIR"/
              rm -f "$FUNCTION_PACKAGE_DIR/go.mod" "$FUNCTION_PACKAGE_DIR/go.sum"

              # cmd/ is optional; move the entrypoint to the package root so it
              # can be imported even when authored under cmd/.
              if [ "$ENTRYPOINT" != "handle.$EXT" ]; then
                ENTRYPOINT_FILE="$FUNCTION_PACKAGE_DIR/$ENTRYPOINT"
                if [ "$(awk '/^package[[:space:]]+/{print $2; exit}' "$ENTRYPOINT_FILE")" = "main" ]; then
                  sed -i -E "s/^package[[:space:]]+.*/package $PACKAGE_NAME/" "$ENTRYPOINT_FILE"
                fi
                mv "$ENTRYPOINT_FILE" "$FUNCTION_PACKAGE_DIR/handle.$EXT"
              fi

              MODULE=$(awk '/^module[[:space:]]+/{print $2; exit}' "litefunctions/$CONTEXT/go.mod")
              PACKAGE_IMPORT="$MODULE/functions"
              RUNTIME_PACKAGE=$(awk '/^package[[:space:]]+/{print $2; exit}' "$RUNTIME_DIR"/*.go 2>/dev/null || true)
              [ -n "$RUNTIME_PACKAGE" ] || RUNTIME_PACKAGE=runtime

              if [ "$TARGET_FILE" = "function_async.$EXT" ]; then
                cat > "$RUNTIME_DIR/$TARGET_FILE" <<EOF
          package $RUNTIME_PACKAGE

          import fn "$PACKAGE_IMPORT/$PACKAGE_NAME"

          func StreamHandler(input <-chan []byte) <-chan []byte {
          	return fn.StreamHandler(input)
          }
          EOF
              else
                cat > "$RUNTIME_DIR/$TARGET_FILE" <<EOF
          package $RUNTIME_PACKAGE

          import (
          	"net/http"

          	fn "$PACKAGE_IMPORT/$PACKAGE_NAME"
          )

          func Handle(w http.ResponseWriter, r *http.Request) {
          	fn.Handle(w, r)
          }
          EOF
              fi
              ;;

            module)
              # Copy the whole function package into its module directory and
              # expose the entrypoint where the runtime declares it. The runtime
              # manifest owns dependencies, so drop function-level manifests.
              MODULE_DIR="$RUNTIME_DIR/$(basename "$TARGET_FILE" ".$EXT")"
              mkdir -p "$MODULE_DIR"
              cp -R "$FUNCTION_DIR"/. "$MODULE_DIR"/
              rm -f "$MODULE_DIR/Cargo.toml" "$MODULE_DIR/Cargo.lock" \
                    "$MODULE_DIR/go.mod" "$MODULE_DIR/go.sum"
              mv "$MODULE_DIR/$ENTRYPOINT" "$RUNTIME_DIR/$TARGET_FILE"
              ;;

            *)
              echo "Unknown inject mode for $LANG: $MODE" >&2
              exit 1
              ;;
          esac

          echo "FUNCTION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "RUNTIME_LANG=$LANG" >> "$GITHUB_ENV"
          echo "RUNTIME_CONTEXT=$CONTEXT" >> "$GITHUB_ENV"
          echo "RUNTIME_DOCKERFILE=$DOCKERFILE" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${IMAGE_PREFIX}/runtime-${LANG}-${REPO_NAME}-${NAME}" >> "$GITHUB_ENV"

      - name: Build and Push with Kaniko
        if: steps.select.outputs.name != ''
        uses: docker://gcr.io/kaniko-project/executor:latest
        with:
          args: >
            --context=dir://litefunctions/${{ env.RUNTIME_CONTEXT }}
            --dockerfile=../../${{ env.RUNTIME_DOCKERFILE }}
            --destination=${{ env.IMAGE }}:latest
            --destination=${{ env.IMAGE }}:${{ gitea.sha }}
            --build-arg PROJECT=${{ needs.detect-changes.outputs.repo_name }}
            --build-arg NAME=${{ env.FUNCTION_NAME }}
            --build-arg GIT_TOKEN=${{ secrets.GITEA_TOKEN }}
            --cache=true
            --cache-copy-layers=true
            --cache-ttl=336h
            --insecure
            --skip-tls-verify
            --skip-push-permission-check
            --verbosity=info

  # Dynamic path: no image build, the warm runtime reloads from git.
  notify-dynamic:
    needs: detect-changes
    if: needs.detect-changes.outputs.dynamic-languages != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Notify runtime hooks
        env:
          DYNAMIC_LANGUAGES: ${{ needs.detect-changes.outputs.dynamic-languages }}
          REPO_NAME: ${{ needs.detect-changes.outputs.repo_name }}
        run: |
          set -euo pipefail
          echo "$DYNAMIC_LANGUAGES" | jq -r '.[]' | while IFS= read -r language; do
            echo "Triggering $language runtime hook for $REPO_NAME"
            curl -fsS -X POST "${INGESTOR_HOOK_BASE_URL}/hook/${language}/${REPO_NAME}"
          done
