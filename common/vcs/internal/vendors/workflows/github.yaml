name: Docker
on:
  push:
    branches: [ "main" ]
  #   tags: [ 'v*.*.*' ]
  # pull_request:
  #   branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}
  PORTAL_RUNTIME_ASSETS_URL: ""
  INGESTOR_HOOK_BASE_URL: ""

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      go: ${{ steps.changes.outputs.go }}
      java: ${{ steps.changes.outputs.java }}
      zig: ${{ steps.changes.outputs.zig }}
      python: ${{ steps.changes.outputs.python }}
      ts: ${{ steps.changes.outputs.ts }}
      lua: ${{ steps.changes.outputs.lua }}
      rust-files: ${{ steps.get-changed-files.outputs.rust-files }}
      go-files: ${{ steps.get-changed-files.outputs.go-files }}
      java-files: ${{ steps.get-changed-files.outputs.java-files }}
      repo_name: ${{ steps.set-repo-name.outputs.repo_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            rust:
              - 'functions/rs/**'
              - 'functions/rust/**'
            go:
              - 'functions/go/**'
            java:
              - 'functions/java/**'
            zig:
              - 'functions/zig/**'
            python:
              - 'functions/python/**'
            ts:
              - 'functions/ts/**'
            lua:
              - 'functions/lua/**'

      - name: Get changed files
        id: get-changed-files
        run: |
          # Get changed Rust files as JSON array
          RUST_FILES_JSON=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }} -- 'functions/rs/**' 'functions/rust/**' | awk -F/ '($2 == "rs" || $2 == "rust") && NF >= 4 { print $3 }' | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "rust-files=${RUST_FILES_JSON}" >> $GITHUB_OUTPUT
          
          # Get changed Go files as JSON array
          GO_FILES_JSON=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }} -- 'functions/go/**' | awk -F/ '$2 == "go" && NF >= 4 { print $3 }' | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "go-files=${GO_FILES_JSON}" >> $GITHUB_OUTPUT

          # Get changed Java files as JSON array
          JAVA_FILES_JSON=$(git diff --name-only ${{ github.event.before }}..${{ github.sha }} -- 'functions/java/**' | awk -F/ '$2 == "java" && NF >= 4 { print $3 }' | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "java-files=${JAVA_FILES_JSON}" >> $GITHUB_OUTPUT

      - name: Set repo name
        id: set-repo-name
        run: |
          REPO_NAME=$(basename "${{ github.repository }}")
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

  build-rust:
    needs: detect-changes
    if: needs.detect-changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        rust-file: ${{ fromJson(needs.detect-changes.outputs.rust-files) }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: current-repo

      - name: Fetch litefunctions runtimes (optional)
        run: |
          if [ -n "${PORTAL_RUNTIME_ASSETS_URL}" ]; then
            mkdir -p litefunctions
            curl -fsSL "${PORTAL_RUNTIME_ASSETS_URL}" | tar -xz -C litefunctions
            if [ ! -d "litefunctions/runtimes/go/internal" ] && [ ! -d "litefunctions/runtimes/go/pkg" ]; then
              echo "Runtime assets missing after download, cleaning up..."
              rm -rf litefunctions
            fi
          else
            echo "PORTAL_RUNTIME_ASSETS_URL not set, skipping runtime asset download."
          fi

      - name: Checkout litefunctions repository (fallback)
        if: ${{ env.PORTAL_RUNTIME_ASSETS_URL == '' || (env.PORTAL_RUNTIME_ASSETS_URL != '' && hashFiles('litefunctions/runtimes/go/internal/function.go') == '' && hashFiles('litefunctions/runtimes/go/pkg/function.go') == '') }}
        uses: actions/checkout@v4
        with:
          repository: ashupednekar/litefunctions
          path: litefunctions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Always pull the latest base image to get updates
      - name: Pull latest base image
        run: |
          docker pull ashupednekar535/litefunctions-runtime-rs:base

      - name: Inject Rust function package into runtime
        run: |
          RUST_FILE="${{ matrix.rust-file }}"
          FUNCTION_DIR="current-repo/functions/rs/$RUST_FILE"
          if [ ! -d "$FUNCTION_DIR" ]; then
            FUNCTION_DIR="current-repo/functions/rust/$RUST_FILE"
          fi
          SRC="$FUNCTION_DIR/handle.rs"
          if [ ! -f "$SRC" ]; then
            echo "Function source not found: $SRC"
            exit 1
          fi
          RUST_RUNTIME_DIR="litefunctions/runtimes/rust/internal"
          if [ ! -d "$RUST_RUNTIME_DIR" ]; then
            RUST_RUNTIME_DIR="litefunctions/runtimes/rust/pkg"
          fi
          TARGET="$RUST_RUNTIME_DIR/function.rs"
          if grep -Eq "stream_handler" "$SRC"; then
            TARGET="$RUST_RUNTIME_DIR/function_async.rs"
          fi
          MODULE_DIR="$RUST_RUNTIME_DIR/function"
          if [ "$(basename "$TARGET")" = "function_async.rs" ]; then
            MODULE_DIR="$RUST_RUNTIME_DIR/function_async"
          fi
          mkdir -p "$MODULE_DIR"
          cp -R "$FUNCTION_DIR"/. "$MODULE_DIR/"
          rm -f "$MODULE_DIR/Cargo.toml" "$MODULE_DIR/Cargo.lock"
          mv "$MODULE_DIR/handle.rs" "$TARGET"

      - name: Build and push Rust Docker image
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          RUST_FILE="${{ matrix.rust-file }}"

          IMG_TAG=${{ env.REGISTRY }}/${{ github.actor }}/$(basename ${{ env.REPO_NAME }})/runtime-rust-${RUST_FILE}:latest
          CACHE_TAG=${{ env.REGISTRY }}/${{ github.actor }}/$(basename ${{ env.REPO_NAME }})/runtime-rust-${RUST_FILE}:cache
          
          cd litefunctions

          # Build with registry cache and always pull base images
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker buildx build \
              --pull \
              --push \
              --tag ${IMG_TAG} \
              --cache-from=type=registry,ref=${CACHE_TAG} \
              --cache-to=type=registry,ref=${CACHE_TAG},mode=max \
              --cache-from=ashupednekar535/litefunctions-runtime-rs:base \
              --file build/runtimes/Dockerfile.rust \
              --build-arg PROJECT=${REPO_NAME} \
              --build-arg NAME=${RUST_FILE} \
              --build-arg GIT_TOKEN=${{ secrets.GITHUB_TOKEN }} \
              runtimes/rust/
          else
            # For pull requests, build without pushing but still pull latest
            docker buildx build \
              --pull \
              --tag ${IMG_TAG} \
              --cache-from=type=registry,ref=${CACHE_TAG} \
              --cache-from=ashupednekar535/litefunctions-runtime-rs:base \
              --file build/runtimes/Dockerfile.rust \
              --build-arg PROJECT=${REPO_NAME} \
              --build-arg NAME=${RUST_FILE} \
              --build-arg GIT_TOKEN=${{ secrets.GITHUB_TOKEN }} \
              runtimes/rust/
          fi

  build-go:
    needs: detect-changes
    if: needs.detect-changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        go-file: ${{ fromJson(needs.detect-changes.outputs.go-files) }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: current-repo

      - name: Fetch litefunctions runtimes (optional)
        run: |
          if [ -n "${PORTAL_RUNTIME_ASSETS_URL}" ]; then
            mkdir -p litefunctions
            curl -fsSL "${PORTAL_RUNTIME_ASSETS_URL}" | tar -xz -C litefunctions
            if [ ! -d "litefunctions/runtimes/go/internal" ]; then
              echo "Runtime assets missing after download, cleaning up..."
              rm -rf litefunctions
            fi
          else
            echo "PORTAL_RUNTIME_ASSETS_URL not set, skipping runtime asset download."
          fi

      - name: Checkout litefunctions repository (fallback)
        if: ${{ env.PORTAL_RUNTIME_ASSETS_URL == '' || (env.PORTAL_RUNTIME_ASSETS_URL != '' && hashFiles('litefunctions/runtimes/go/internal/function.go') == '') }}
        uses: actions/checkout@v4
        with:
          repository: ashupednekar/litefunctions
          path: litefunctions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Go function into runtime
        run: |
          GO_FILE="${{ matrix.go-file }}"
          FUNCTION_DIR="current-repo/functions/go/${GO_FILE}"
          ENTRYPOINT="handle.go"
          if [ ! -f "$FUNCTION_DIR/handle.go" ] && [ -f "$FUNCTION_DIR/cmd/handle.go" ]; then
            ENTRYPOINT="cmd/handle.go"
          fi
          if [ ! -f "$FUNCTION_DIR/$ENTRYPOINT" ]; then
            echo "Function entrypoint not found: $FUNCTION_DIR/$ENTRYPOINT"
            exit 1
          fi

          TARGET_FILE="function.go"
          if grep -Eq "func[[:space:]]+StreamHandler" "$FUNCTION_DIR/$ENTRYPOINT"; then
            TARGET_FILE="function_async.go"
          fi

          RUNTIME_DIR="litefunctions/runtimes/go/internal"
          if [ ! -d "$RUNTIME_DIR" ]; then
            RUNTIME_DIR="litefunctions/runtimes/go/pkg"
          fi
          RUNTIME_PACKAGE=$(awk '/^package[[:space:]]+/{print $2; exit}' "$RUNTIME_DIR"/*.go 2>/dev/null || true)
          [ -n "$RUNTIME_PACKAGE" ] || RUNTIME_PACKAGE=runtime

          MODULE=$(awk '/^module[[:space:]]+/{print $2; exit}' litefunctions/runtimes/go/go.mod)
          PACKAGE_ROOT="litefunctions/runtimes/go/functions"
          PACKAGE_NAME=$(basename "$FUNCTION_DIR" | tr -c '[:alnum:]_' '-' | sed 's/^-*//; s/-*$//')
          FUNCTION_PACKAGE_DIR="$PACKAGE_ROOT/$PACKAGE_NAME"
          mkdir -p "$FUNCTION_PACKAGE_DIR"
          cp -R "$FUNCTION_DIR"/. "$FUNCTION_PACKAGE_DIR"/
          rm -f "$FUNCTION_PACKAGE_DIR/go.mod" "$FUNCTION_PACKAGE_DIR/go.sum"

          if [ "$ENTRYPOINT" != "handle.go" ]; then
            ENTRYPOINT_FILE="$FUNCTION_PACKAGE_DIR/$ENTRYPOINT"
            if [ "$(awk '/^package[[:space:]]+/{print $2; exit}' "$ENTRYPOINT_FILE")" = "main" ]; then
              sed -i -E "s/^package[[:space:]]+.*/package $PACKAGE_NAME/" "$ENTRYPOINT_FILE"
            fi
            mv "$ENTRYPOINT_FILE" "$FUNCTION_PACKAGE_DIR/handle.go"
          fi

          if [ "$TARGET_FILE" = "function_async.go" ]; then
            cat > "$RUNTIME_DIR/$TARGET_FILE" <<EOF
          package $RUNTIME_PACKAGE

          import fn "$MODULE/functions/$PACKAGE_NAME"

          func StreamHandler(input <-chan []byte) <-chan []byte {
          	return fn.StreamHandler(input)
          }
          EOF
          else
            cat > "$RUNTIME_DIR/$TARGET_FILE" <<EOF
          package $RUNTIME_PACKAGE

          import (
          	"net/http"

          	fn "$MODULE/functions/$PACKAGE_NAME"
          )

          func Handle(w http.ResponseWriter, r *http.Request) {
          	fn.Handle(w, r)
          }
          EOF
          fi

      - name: Build and push Go Docker image
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          GO_FILE="${{ matrix.go-file }}"
          
          cd litefunctions
          docker build -t ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-go-${GO_FILE}:${{ github.sha }} \
            runtimes/go/ \
            -f build/runtimes/Dockerfile.go \
            --build-arg PROJECT=${REPO_NAME} \
            --build-arg NAME=${GO_FILE} \
            --build-arg GIT_TOKEN=${{ secrets.GITHUB_TOKEN }}
          
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-go-${GO_FILE}:${{ github.sha }}
          fi

  build-java:
    needs: detect-changes
    if: needs.detect-changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        java-file: ${{ fromJson(needs.detect-changes.outputs.java-files) }}
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          path: current-repo

      - name: Fetch litefunctions runtimes (optional)
        run: |
          if [ -n "${PORTAL_RUNTIME_ASSETS_URL}" ]; then
            mkdir -p litefunctions
            curl -fsSL "${PORTAL_RUNTIME_ASSETS_URL}" | tar -xz -C litefunctions
            if [ ! -d "litefunctions/runtimes/java/src/main/java/com/example/internal" ]; then
              echo "Runtime assets missing after download, cleaning up..."
              rm -rf litefunctions
            fi
          else
            echo "PORTAL_RUNTIME_ASSETS_URL not set, skipping runtime asset download."
          fi

      - name: Checkout litefunctions repository (fallback)
        if: ${{ env.PORTAL_RUNTIME_ASSETS_URL == '' || (env.PORTAL_RUNTIME_ASSETS_URL != '' && hashFiles('litefunctions/runtimes/java/src/main/java/com/example/internal/fn/FunctionImpl.java') == '') }}
        uses: actions/checkout@v4
        with:
          repository: ashupednekar/litefunctions
          path: litefunctions

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Java function into runtime
        run: |
          JAVA_FILE="${{ matrix.java-file }}"
          FUNCTION_DIR="current-repo/functions/java/${JAVA_FILE}"
          ENTRYPOINT="handle.java"
          if [ ! -f "$FUNCTION_DIR/$ENTRYPOINT" ]; then
            echo "Function entrypoint not found: $FUNCTION_DIR/$ENTRYPOINT"
            exit 1
          fi

          RUNTIME_DIR="litefunctions/runtimes/java/src/main/java/com/example/internal/fn"
          if [ ! -d "$RUNTIME_DIR" ]; then
            echo "Java runtime package not found: $RUNTIME_DIR"
            exit 1
          fi

          cp -R "$FUNCTION_DIR"/. "$RUNTIME_DIR"/
          rm -f "$RUNTIME_DIR/pom.xml" "$RUNTIME_DIR/build.gradle" \
                "$RUNTIME_DIR/build.gradle.kts" "$RUNTIME_DIR/settings.gradle"

          if grep -Eq "streamHandler" "$FUNCTION_DIR/$ENTRYPOINT"; then
            cat > "$RUNTIME_DIR/FunctionImpl.java" <<'EOF'
          package com.example.internal.fn;

          import com.example.internal.Function;
          import java.util.stream.Stream;
          import org.springframework.stereotype.Component;

          @Component
          public class FunctionImpl implements Function {

          	private final Handler delegate = new Handler();

          	@Override
          	public byte[] handle(byte[] body) {
          		Stream<byte[]> out = delegate.streamHandler(Stream.of(body));
          		try {
          			return out.findFirst().orElseGet(() -> new byte[0]);
          		}
          		finally {
          			out.close();
          		}
          	}

          	@Override
          	public Stream<byte[]> streamHandler(Stream<byte[]> input) {
          		return delegate.streamHandler(input);
          	}

          }
          EOF
          else
            cat > "$RUNTIME_DIR/FunctionImpl.java" <<'EOF'
          package com.example.internal.fn;

          import com.example.internal.Function;
          import java.util.stream.Stream;
          import org.springframework.stereotype.Component;

          @Component
          public class FunctionImpl implements Function {

          	private final Handler delegate = new Handler();

          	@Override
          	public byte[] handle(byte[] body) {
          		return delegate.handle(body);
          	}

          	@Override
          	public Stream<byte[]> streamHandler(Stream<byte[]> input) {
          		return input.map(delegate::handle);
          	}

          }
          EOF
          fi

      - name: Build and push Java Docker image
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          JAVA_FILE="${{ matrix.java-file }}"

          cd litefunctions
          docker build -t ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-java-${JAVA_FILE}:${{ github.sha }} \
            runtimes/java/ \
            -f build/runtimes/Dockerfile.java \
            --build-arg PROJECT=${REPO_NAME} \
            --build-arg NAME=${JAVA_FILE} \
            --build-arg GIT_TOKEN=${{ secrets.GITHUB_TOKEN }}

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            docker push ${{ env.REGISTRY }}/${{ env.REPO_NAME }}-java-${JAVA_FILE}:${{ github.sha }}
          fi

  hook-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true' && env.INGESTOR_HOOK_BASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Notify Python runtime hook
        run: |
          curl -fsS -X POST "${{ env.INGESTOR_HOOK_BASE_URL }}/hook/python/${{ needs.detect-changes.outputs.repo_name }}"

  hook-ts:
    needs: detect-changes
    if: needs.detect-changes.outputs.ts == 'true' && env.INGESTOR_HOOK_BASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Notify TypeScript runtime hook
        run: |
          curl -fsS -X POST "${{ env.INGESTOR_HOOK_BASE_URL }}/hook/ts/${{ needs.detect-changes.outputs.repo_name }}"

  hook-lua:
    needs: detect-changes
    if: needs.detect-changes.outputs.lua == 'true' && env.INGESTOR_HOOK_BASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Notify Lua runtime hook
        run: |
          curl -fsS -X POST "${{ env.INGESTOR_HOOK_BASE_URL }}/hook/lua/${{ needs.detect-changes.outputs.repo_name }}"
